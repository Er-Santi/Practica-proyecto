sla:
  reminder_after_hours: 4
  second_reminder_after_hours: 8
  escalate_after_hours: 16
  next_level_reminder_after_hours: 24
  commercial_delivery_after_hours: 32
  # También repite la pregunta de aprobación humana si sigue pendiente.
  repeat_after_hours: 2
  target_hours: 8

simulation:
  max_hours: 48
  recursion_limit: 16

llm:
  # false: clasifica por reglas y usa mensajes de plantilla, sin OpenRouter.
  enabled: false
  max_calls: 60

assignment:
  max_open_projects_per_pm: 10

testing:
  enabled: true
  reminder_after_minutes: 1
  second_reminder_after_minutes: 2
  escalate_after_minutes: 4
  next_level_reminder_after_minutes: 6
  commercial_delivery_after_minutes: 8
  # También repite la pregunta de aprobación humana si sigue pendiente.
  repeat_after_minutes: 2
  sla_target_minutes: 3
  check_interval_seconds: 5
